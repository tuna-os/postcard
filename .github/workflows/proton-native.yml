name: Proton native prototype
on:
  pull_request:
    paths:
      - 'native/proton/**'
      - 'src/postcard/core/net/proton*.py'
      - 'tests/core/net/test_proton*.py'
      - '.github/workflows/proton-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Check Go formatting
        run: test -z "$(gofmt -l native/proton)"
      - name: Vet, build and test the helper stub
        run: |
          cd native/proton
          go vet ./...
          go test ./...
          go build -o postcard-proton .
      - name: Test the Python and compiled-helper contract without an account
        run: |
          python3 -m pip install pytest
          POSTCARD_PROTON_TEST_BINARY="$PWD/native/proton/postcard-proton" \
            python3 -m pytest tests/core/net/test_proton_session.py
