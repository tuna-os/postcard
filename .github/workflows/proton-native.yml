name: Proton native prototype
on:
  pull_request:
    paths:
      - 'native/proton/**'
      - 'src/postcard/core/net/proton*.py'
      - 'tests/core/net/test_proton*.py'
      - '.github/workflows/proton-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Exact patch, not '1.24': setup-go resolves short versions to the
          # latest patch. The go.mod `go` directive stays the minimum floor.
          # Bump deliberately; dependabot does not see this (see
          # docs/supply-chain.md).
          go-version: '1.24.13'
      - name: Check Go formatting
        # vendor/ carries third-party files as published; only first-party
        # sources must be gofmt-clean.
        run: test -z "$(gofmt -l native/proton | grep -v '^native/proton/vendor/')"
      - name: Verify the vendored tree matches go.mod/go.sum
        run: |
          cd native/proton
          go mod vendor
          git diff --exit-code -- vendor/ go.mod go.sum
      - name: Vet, build and test the helper stub
        run: |
          cd native/proton
          go vet ./...
          go test ./...
          GOPROXY=off go build -mod=vendor -o postcard-proton .
      - name: Test the Python and compiled-helper contract without an account
        run: |
          python3 -m pip install -c requirements.txt pytest
          POSTCARD_PROTON_TEST_BINARY="$PWD/native/proton/postcard-proton" \
            python3 -m pytest tests/core/net/test_proton_session.py
