name: Accessibility metadata

# Translation extraction and installable-metadata validation for issue #23:
# the .pot template must match the sources (so new accessible names are
# translatable from day one), the .blp must compile, and the desktop,
# AppStream and GSettings files must validate. The GUI suite itself runs
# in gui-tests.yml, which picks up tests/gui/test_a11y.py wholesale.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'po/**'
      - 'data/**'
      - '.github/workflows/a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gettext appstream \
            desktop-file-utils libglib2.0-bin libglib2.0-dev-bin python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1
          # Ubuntu's blueprint-compiler (0.12) predates Adw.Spinner, so the
          # tree would not compile; use the Flatpak manifest's pin instead.
          # The PyPI entry script ships an empty shebang, so it runs here
          # through an explicit interpreter on PATH.
          python3 -m pip install --user "blueprint-compiler==0.20.4"
          mkdir -p "$HOME/.local/bpshim"
          # HOME cannot change between here and the compile step, so the shim
          # bakes the path in at generation time.
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' \
            "$HOME/.local/bin/blueprint-compiler" \
            > "$HOME/.local/bpshim/blueprint-compiler"
          chmod +x "$HOME/.local/bpshim/blueprint-compiler"
          echo "$HOME/.local/bpshim" >> "$GITHUB_PATH"

      - name: Configure
        run: meson setup build

      # Not `just pot`: CI needs no `just`, and this is its one step.
      - name: Check the translation template is fresh
        run: |
          ninja -C build postcard-pot
          # The creation date changes on every run; everything else must not.
          sed '/^"POT-Creation-Date:/d' po/postcard.pot > /tmp/pot-regen
          git show HEAD:po/postcard.pot | sed '/^"POT-Creation-Date:/d' > /tmp/pot-committed
          diff /tmp/pot-committed /tmp/pot-regen

      - name: Compile Blueprints and validate metadata
        run: |
          meson compile -C build
          meson test -C build
