name: Accessibility metadata

# Translation extraction and installable-metadata validation for issue #23:
# the .pot template must match the sources (so new accessible names are
# translatable from day one), and the desktop, AppStream and GSettings files
# must validate. Blueprint compiling stays with the Flatpak build in the gui
# job: the host's libadwaita 1.5 predates Adw.ShortcutsDialog, so a host-side
# compile can never agree with the SDK about the tree. The GUI suite itself
# runs in gui-tests.yml, which picks up tests/gui/test_a11y.py wholesale.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'po/**'
      - 'data/**'
      - '.github/workflows/a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install validation tooling
        run: |
          sudo apt-get update
          # blueprint-compiler only needs to exist for meson setup to pass;
          # compiling stays in the Flatpak build, so the apt version's age
          # does not matter here.
          sudo apt-get install -y meson ninja-build gettext appstream \
            desktop-file-utils libglib2.0-bin libglib2.0-dev-bin \
            blueprint-compiler

      - name: Configure
        run: meson setup build

      # Not `just pot`: CI needs no `just`, and this is its one step.
      - name: Check the translation template is fresh
        run: |
          ninja -C build postcard-pot
          # The creation date changes on every run; everything else must not.
          sed '/^"POT-Creation-Date:/d' po/postcard.pot > /tmp/pot-regen
          git show HEAD:po/postcard.pot | sed '/^"POT-Creation-Date:/d' > /tmp/pot-committed
          diff /tmp/pot-committed /tmp/pot-regen

      # meson test builds what the validation tests need (the merged
      # desktop/metainfo files) and nothing else -- notably not Blueprints.
      - name: Validate metadata
        run: meson test -C build
