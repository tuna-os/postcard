name: Site

# Publishes the landing page on its own, so a copy fix doesn't have to wait for
# a release. keep_files is what makes this safe: release.yml owns the branch with
# force_orphan, and the signed ostree repo/ lives there. Wiping it would break
# `flatpak update` for everyone already running Postcard.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble the site
        run: sh web/build.sh site

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: pages
          keep_files: true
          cname: postcard.gxanshu.in
